name = "market-price-bot"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["*/30 * * * *"]

[vars]
TELEGRAM_CHANNEL = "@alan_chandeh"
# TELEGRAM_BOT_TOKEN باید از طریق Cloudflare Dashboard > Settings > Variables and Secrets ست بشه
# هرگز bot token رو اینجا ننویس چون فایل روی GitHub پابلیک میشه
# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true